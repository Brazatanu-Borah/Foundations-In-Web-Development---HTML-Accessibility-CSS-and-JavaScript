<!-- 
  'index.html' - standard way of representing the homepage/entrypoint of the website
    - this is set in hosting servers (unix based servers)
    - other pages can be called 'about.html' or 'contact.html'
    - placed at the root folder of our website (can be placed in any folder though)

  >> we can change this default behavior to make any other named page as our website entry page

      old windows - index.htm  (3 letter extension) \ .doc
      new windows - index.html (4 letter extension) \ .docx

  always stays at the root folder of the website

  2 important parts of HTML (tags, elements and attributes)
      TAGS
        - opening tag and closing tag
        - inside < and > symbols
          >> scope/boundaries of the element
        - some tags don't have ending tag
        ❗ We have a concept of 'NESTING', Parent-Child from this
          - like plastic container set - smallest > smaller > big > bigger > biggest

      ELEMENTS
        - tags + content

      ATTRIBUTES


    Every html (HTML5) element has some default browser styles and some basic interactivity


    📝 HTML IS ONLY FOR STRUCTURE 👆👆👆👆
    --------------------------------------


-->



<!-- Tells the browser that we are using version 5 of HTML (Living Standard)
  - only tag not conforming to normal/standard tag structure
-->
<!DOCTYPE html>

<!-- Root of our document <html>
    (only 2 child elements allowed)
      head
      body
  -->
<html>

  <!-- First child of 'html' - <head> (meta data/information for/of the page) -->
  <head>

  </head>

  <!-- Second child of 'html' - <body> (actual content for the page) -->
  <body>
    This is a test of our new web page.
  </body>

</html>
