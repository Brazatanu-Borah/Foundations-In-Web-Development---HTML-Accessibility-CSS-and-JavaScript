<!DOCTYPE html>
<html>

  <head>
    <title>Our First Webpage</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <h1>Hello World</h1>

    <!-- 

      Lists are used to display data as a 'semantic' set
        - related items (array/set) that belong to a group
        - feature list cards, faqs, bullet points etc

      Semantic Structure For Lists
        ul/ol + li [NOTHING ELSE]
      
      ul/ol - the container tags to hold the list items
        - only <li> tags are allowed directly inside the ul/ol
        
        ul - navigation menu, list of resources, info cards, faq ...
        ol - priority, rankings, steps of a process ...

        li  - actual data elements of the set
          >> can be text, links, images, headings, inputs, icons, divs, tables, forms

    -->


    <!-- Unordered List -->
    <h3>Unordered List</h3>
    <ul>
      <li>Apple</li>
      <li>Orange</li>
      <li>Watermelon</li>
    </ul>

    <ul>
      <li><a href="#">toc</a> &bull; <a href="#">privacy policy</a></li>
    </ul>

    <!-- Ordered List -->
    <!-- (shows order of events) -->
    <h3>Ordered List (order of events)</h3>
    <ol>
      <li>Wake up</li>
      <li>Have breakup</li>
      <li>Go to work</li>
    </ol>

    <!-- (order of importance/ranking) -->
    <h3>Ordered List (order of importance/ranking)</h3>
    <ol>
      <li>King</li>
      <li>Minister</li>
      <li>Soldier</li>
    </ol>

  </body>

</html>
