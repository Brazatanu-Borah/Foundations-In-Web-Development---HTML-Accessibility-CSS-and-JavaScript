<!DOCTYPE html>
<html>

  <head>
    <title>Our First Webpage</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  </head>

  <body>

    <!-- 'Section Heading' tags provide structural hierarchy for our body content -->
    <!-- 
        h1 - one one per html document/per web page (main title, main keyword for the webpage)

        h2 - headings of most major sections in that document (most used)
        h3 - subheadings that support or are in the group of a h2 (less than h2)
        h4 - lower in ranking than h3 (lowest used)

        h5 - almost never used
        h6 - almost never used

        Default sizes indicate importance/hierarchy (not stylistic sizing)
        - lower number indicates more importance
        - hierarchy is shown using sizes (be default) not nesting

        h4 is generally the same size as regular text (but is bolded)

        Always place heading tags in descending order
        Never miss/jump a heading level 
        Never nest headings inside one another
          >> a h3 must have a h2 above it, if it doesn't then change that h3 to h2)
          h1
            h2
              h3
                h4 etc

          - create content groups
          - the content is somehow related to the immediate heading level

        Alter the size of the headings using CSS later (the underlying structure and importance remains intact though)
  -->

    <h1>Main Site Title</h1>

      <!-- first h2 content group -->
      <h2>Major Point 1</h2>
        <h3>Sub Major Point 1</h3>
          <h4>Minor Point 1</h4>
          <h4>Minor Point 2</h4>
            <h5>Very Minor Point 1</h5>

      <!-- second h2 content group -->
      <h2>Major Point 2</h2>
        <h3>Sub Major Point 1</h3>
          <h4>Minor Point 3</h4>
        <h3>Sub Major Point 2</h3>
          <h4>Minor Point 4</h4>


    This is normal text without any html tag


  </body>

</html>
