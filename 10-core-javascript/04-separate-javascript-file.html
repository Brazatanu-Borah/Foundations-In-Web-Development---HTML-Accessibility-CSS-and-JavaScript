<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    
    <title>Core JavaScript</title>
  </head>

<body>
  <h1>Core JavaScript Demo</h1>



  <!-- External JavaScript File
  
    - plain text file with '.js' file extension
    - one js file can be attached to multiple html files
    - also updating the scripts also becomes easier (one place)
    
    - using the script tag using a 'src' attribute which defines the location of the external JS file (relative or absolute file path)

    - we don't have to write the <script> tags, as we are directly inside a javascript file

  -->
  <script src="./js/main.js"></script>

</body>

</html>
